name: Build Windows release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv and Python
        # astral-sh/setup-uv v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.10"
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $projectVersion = uv version --short
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($projectVersion -ne $tagVersion) {
            throw (
              "Tag version $tagVersion does not match " +
              "project version $projectVersion"
            )
          }

      - name: Run tests
        run: uv run pytest

      - name: Build executable
        run: uv run pyinstaller --noconfirm --clean ApplyMacro.spec

      - name: Package executable and checksum
        shell: pwsh
        run: |
          $archive = "ApplyMacro-windows-x64-${{ github.ref_name }}.zip"
          Compress-Archive `
            -LiteralPath "dist\ApplyMacro.exe" `
            -DestinationPath $archive
          $hash = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $archive
          ).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content `
            -LiteralPath "$archive.sha256" `
            -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "ApplyMacro-windows-x64-${{ github.ref_name }}.zip"
          gh release create `
            "${{ github.ref_name }}" `
            $archive `
            "$archive.sha256" `
            --generate-notes `
            --title "Apply Macro ${{ github.ref_name }}"
