[project]
name = "apply-macro"
version = "0.2.1"
description = "Windows enrollment helper with mouse shortcuts and popup automation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "keyboard>=0.13.5",
    "pyautogui>=0.9.54",
    "pywin32>=311",
    "pywinauto>=0.6.9",
]

[dependency-groups]
dev = [
    "pyinstaller==6.22.2",
    "pytest>=9.0.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
